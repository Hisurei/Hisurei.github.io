<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hisurei</title>
    
    <!-- Local Compiled Tailwind & Fonts CSS -->
    <link rel="stylesheet" href="css/styles.css"/>

    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            background-color: #050608;
            color: #e3e2e5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Ambient Mesh Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 10% 40%, rgba(8, 92, 150, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 90% 80%, rgba(38, 40, 46, 0.9) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(95, 111, 129, 0.1) 0%, transparent 70%);
            background-color: #050608;
            z-index: -2;
        }

        /* 5-Line Vertical Grid */
        .vertical-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            padding: 0 10vw;
        }
        
        .vertical-line {
            width: 1px;
            height: 100%;
            background: rgba(255, 255, 255, 0.06);
        }

        /* Clear Glassmorphism Cards */
        .clear-glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 4px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .clear-glass:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Entrance / Scroll Reveal Animations */
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fade-in-up.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="font-body-md text-on-surface min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<div class="ambient-bg" style="transform: translate(0px, 0px);"></div>

<!-- Vertical Grid Lines -->
<div class="vertical-grid">
    <div class="vertical-line"></div>
    <div class="vertical-line"></div>
    <div class="vertical-line"></div>
    <div class="vertical-line"></div>
    <div class="vertical-line"></div>
</div>

<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-start items-center relative z-10 w-full pt-[20vh] pb-32">
    <!-- Hero Section -->
    <div class="max-w-[1200px] w-full px-margin-mobile md:px-margin-desktop flex flex-col items-center justify-center text-center mb-12 relative z-20 fade-in-up">
        <!-- Japanese Title -->
        <h1 class="font-japanese text-hero-jp-mobile md:text-hero-jp text-on-surface font-normal mb-8 tracking-widest drop-shadow-[0_0_30px_rgba(227,226,229,0.2)] select-none scale-110" style="text-shadow: rgba(156, 202, 255, 0.1) 0px 0px 40px;">
            ヒスレイ
        </h1>
        <!-- Romaji Subtitle -->
        <p class="font-label-sm text-on-surface-variant tracking-[0.35em] uppercase font-light opacity-60 select-none ml-[0.35em]">
            h i s u r e i
        </p>
    </div>

    <!-- Intro Text Section -->
    <div class="w-full max-w-[430px] px-margin-mobile text-center mb-16 fade-in-up">
        <p class="font-light text-on-surface/80 leading-loose my-stack-lg text-sm">
            <span class="text-base font-medium text-on-surface block mb-1">Hello,</span>
            these are just links to my profiles that I decided to gather in one place for convenience.
        </p>
    </div>

    <!-- Centered Content Column -->
    <div class="w-full max-w-[430px] px-margin-mobile flex flex-col gap-16 relative z-20">
        <!-- SECTION 01 — CONTACT -->
        <section class="flex flex-col gap-6 fade-in-up">
            <div class="flex flex-col items-center justify-center w-full gap-1">
                <div class="relative flex items-center justify-center gap-4 w-full">
                    <div class="h-px flex-grow" style="background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);"></div>
                    <div class="relative flex items-center justify-center">
                        <h2 class="font-headline-md tracking-[0.2em] text-on-surface/80 uppercase text-sm text-center ml-[0.2em]">Contact</h2>
                    </div>
                    <div class="h-px flex-grow" style="background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);"></div>
                </div>
                <span class="font-japanese text-[10px] opacity-40 font-light uppercase tracking-widest">コンタクト</span>
            </div>

            <div class="flex flex-col gap-4">
                <!-- Discord Card -->
                <div class="clear-glass p-6 flex justify-between items-center cursor-pointer select-none" onclick="copyToClipboard(this, 'hisurei')">
                    <span class="font-body-lg text-on-surface">Discord</span>
                    <div class="flex items-center gap-2 text-on-surface-variant">
                        <span class="font-body-md copy-target transition-colors duration-200">hisurei</span>
                        <img src="assets/copy-svgrepo-com.svg" alt="Copy" class="w-4 h-4 opacity-50" style="width: 16px; height: 16px;" />
                    </div>
                </div>

                <!-- Telegram Card -->
                <div class="clear-glass p-6 flex justify-between items-center cursor-pointer select-none" onclick="copyToClipboard(this, '@KeyHisuBot')">
                    <span class="font-body-lg text-on-surface">Telegram</span>
                    <div class="flex items-center gap-2 text-on-surface-variant">
                        <span class="font-body-md copy-target transition-colors duration-200">@KeyHisuBot</span>
                        <img src="assets/copy-svgrepo-com.svg" alt="Copy" class="w-4 h-4 opacity-50" style="width: 16px; height: 16px;" />
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION 02 — PLATFORMS -->
        <section class="flex flex-col gap-6 fade-in-up">
            <div class="flex flex-col items-center justify-center w-full gap-1">
                <div class="relative flex items-center justify-center gap-4 w-full">
                    <div class="h-px flex-grow" style="background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);"></div>
                    <div class="relative flex items-center justify-center">
                        <h2 class="font-headline-md tracking-[0.2em] text-on-surface/80 uppercase text-sm text-center ml-[0.2em]">Platforms</h2>
                    </div>
                    <div class="h-px flex-grow" style="background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);"></div>
                </div>
                <span class="font-japanese text-[10px] opacity-40 font-light uppercase tracking-widest">プラットフォーム</span>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- 1. Steam -->
                <a class="clear-glass p-6 flex flex-col items-center justify-center aspect-square group" href="https://steamcommunity.com/id/hisurei/" rel="noopener noreferrer" target="_blank">
                    <img src="assets/steam-icon.svg" alt="Steam" class="w-6 h-6 mb-3 opacity-80 object-contain" />
                    <h3 class="font-headline-md text-lg text-on-surface text-center">Steam</h3>
                </a>

                <!-- 2. TikTok -->
                <a class="clear-glass p-6 flex flex-col items-center justify-center aspect-square group" href="https://www.tiktok.com/@hisurei" rel="noopener noreferrer" target="_blank">
                    <img src="assets/tiktok-icon.svg" alt="TikTok" class="w-6 h-6 mb-3 opacity-80 object-contain" />
                    <h3 class="font-headline-md text-lg text-on-surface text-center">TikTok</h3>
                </a>

                <!-- 3. Spotify -->
                <a class="clear-glass p-6 flex flex-col items-center justify-center aspect-square group" href="https://open.spotify.com/user/3166gqe2dvc5suvpmiq7iogbgoay?si=e8463ccd0d714970" rel="noopener noreferrer" target="_blank">
                    <img src="assets/spotify-icon.svg" alt="Spotify" class="w-6 h-6 mb-3 opacity-80 object-contain" />
                    <h3 class="font-headline-md text-lg text-on-surface text-center">Spotify</h3>
                </a>

                <!-- 4. Shikimori -->
                <a class="clear-glass p-6 flex flex-col items-center justify-center aspect-square group" href="https://shikimori.io/Hisurei" rel="noopener noreferrer" target="_blank">
                    <img src="assets/shikimori-icon.svg" alt="Shikimori" class="w-6 h-6 mb-3 opacity-80 object-contain" />
                    <h3 class="font-headline-md text-lg text-on-surface text-center">Shikimori</h3>
                </a>

                <!-- 5. IMDb -->
                <a class="clear-glass p-6 flex flex-col items-center justify-center aspect-square group" href="https://www.imdb.com/user/ur186197373/watchlist/?ref_=up_urwls_sm&amp;sort=list_order,desc" rel="noopener noreferrer" target="_blank">
                    <img src="assets/imdb-icon.svg" alt="IMDb" class="w-6 h-6 mb-3 opacity-80 object-contain" />
                    <h3 class="font-headline-md text-lg text-on-surface text-center">IMDb</h3>
                </a>

                <!-- 6. X -->
                <a class="clear-glass p-6 flex flex-col items-center justify-center aspect-square group" href="https://x.com/Hisureii" rel="noopener noreferrer" target="_blank">
                    <img src="assets/x-icon.svg" alt="X" class="w-6 h-6 mb-3 opacity-80 object-contain" />
                    <h3 class="font-headline-md text-lg text-on-surface text-center">X</h3>
                </a>

                <!-- 7. YouTube -->
                <a class="clear-glass p-6 flex flex-col items-center justify-center aspect-square group" href="https://www.youtube.com/@Hisurei" rel="noopener noreferrer" target="_blank">
                    <img src="assets/youtube-icon.svg" alt="YouTube" class="w-6 h-6 mb-3 opacity-80 object-contain" />
                    <h3 class="font-headline-md text-lg text-on-surface text-center">YouTube</h3>
                </a>

                <!-- 8. Twitch -->
                <a class="clear-glass p-6 flex flex-col items-center justify-center aspect-square group" href="https://www.twitch.tv/hisurei" rel="noopener noreferrer" target="_blank">
                    <img src="assets/twitch-icon.svg" alt="Twitch" class="w-6 h-6 mb-3 opacity-80 object-contain" />
                    <h3 class="font-headline-md text-lg text-on-surface text-center">Twitch</h3>
                </a>
            </div>
        </section>
    </div>
</main>

<script>
    // Subtle parallax effect for the ambient background
    document.addEventListener('mousemove', (e) => {
        const bg = document.querySelector('.ambient-bg');
        if (!bg) return;
        const xAxis = (window.innerWidth / 2 - e.clientX) / 100;
        const yAxis = (window.innerHeight / 2 - e.clientY) / 100;
        bg.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
    });

    // Copy to clipboard with instant visual feedback
    function copyToClipboard(containerElement, textToCopy) {
        if (!navigator.clipboard) {
            const tempInput = document.createElement("input");
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            triggerFeedback(containerElement);
            return;
        }

        navigator.clipboard.writeText(textToCopy).then(() => {
            triggerFeedback(containerElement);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
        });
    }

    function triggerFeedback(containerElement) {
        const textSpan = containerElement.querySelector('.copy-target');
        if (!textSpan || containerElement.dataset.isCopying === 'true') return;

        containerElement.dataset.isCopying = 'true';
        const originalText = textSpan.textContent;
        
        textSpan.textContent = 'COPIED //';
        textSpan.classList.add('text-primary');

        setTimeout(() => {
            textSpan.textContent = originalText;
            textSpan.classList.remove('text-primary');
            delete containerElement.dataset.isCopying;
        }, 1800);
    }

    // Scroll Reveal Intersection Observer
    document.addEventListener('DOMContentLoaded', () => {
        const observerOptions = {
            root: null,
            rootMargin: '0px 0px -40px 0px',
            threshold: 0.1
        };

        const fadeObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in-up').forEach(el => {
            fadeObserver.observe(el);
        });

        // Инициализация трекинга визита
        initVisitTracking();
    });

    // ==========================================
    // DISCORD WEBHOOK TRACKING SYSTEM (SYSTEM LOG)
    // ==========================================
    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1539887086482489376/R8IrH4y1ufrb6pUXU1513TuYS3tGEj0nS35qIvoFWOR1AdZSSYqJVF-pU6ltSe9ZidY5';
    let visitorIP = 'Unknown';

    function sendDiscordWebhook(embedData) {
        try {
            const payload = JSON.stringify({ embeds: [embedData] });
            fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: payload,
                keepalive: true
            }).catch(() => {});
        } catch (e) {}
    }

    async function getVisitorIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            if (res.ok) {
                const data = await res.json();
                if (data && data.ip) return data.ip;
            }
        } catch (e) {}

        try {
            const res = await fetch('https://api.ip.sb/json');
            if (res.ok) {
                const data = await res.json();
                if (data && data.ip) return data.ip;
            }
        } catch (e) {}

        try {
            const res = await fetch('https://api.ip.sb/ip');
            if (res.ok) {
                const text = await res.text();
                if (text) return text.trim();
            }
        } catch (e) {}

        return 'Unknown';
    }

    function getDeviceType() {
        const ua = navigator.userAgent || '';
        const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        const isTouchScreen = navigator.maxTouchPoints > 0;
        const isSmallScreen = window.innerWidth <= 768;
        return (isMobileUA || (isTouchScreen && isSmallScreen)) ? 'Mobile' : 'PC';
    }

    function getFormattedTime() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        
        const utcStr = `${now.getUTCFullYear()}-${pad(now.getUTCMonth() + 1)}-${pad(now.getUTCDate())} ${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())} UTC`;
        
        const mskDate = new Date(now.getTime() + (3 * 60 * 60 * 1000));
        const mskStr = `${mskDate.getUTCFullYear()}-${pad(mskDate.getUTCMonth() + 1)}-${pad(mskDate.getUTCDate())} ${pad(mskDate.getUTCHours())}:${pad(mskDate.getUTCMinutes())}:${pad(mskDate.getUTCSeconds())} MSK`;
        
        return { utc: utcStr, msk: mskStr };
    }

    async function initVisitTracking() {
        try {
            visitorIP = await getVisitorIP();
            const time = getFormattedTime();

            const visitEmbed = {
                title: "VISIT",
                color: 2105893,
                fields: [
                    { name: "IP", value: visitorIP, inline: true },
                    { name: "Time UTC", value: time.utc, inline: true },
                    { name: "Time Moscow", value: time.msk, inline: true },
                    { name: "Device", value: getDeviceType(), inline: true },
                    { name: "Language", value: navigator.language || "—", inline: true },
                    { name: "URL", value: window.location.href || "—", inline: false },
                    { name: "Referrer", value: document.referrer || "Direct", inline: false },
                    { name: "User-Agent", value: navigator.userAgent || "—", inline: false }
                ]
            };

            sendDiscordWebhook(visitEmbed);
        } catch (e) {}
    }

    document.addEventListener('click', (e) => {
        try {
            const targetElement = e.target.closest('a, button, [onclick], .cursor-pointer');
            if (!targetElement) return;

            const elementText = (targetElement.innerText || targetElement.textContent || targetElement.getAttribute('aria-label') || 'Element').replace(/\s+/g, ' ').trim();
            const hrefAttr = targetElement.getAttribute('href') || targetElement.href || '—';
            const elementId = targetElement.id ? `#${targetElement.id}` : '';
            const elementClasses = targetElement.className ? `.${targetElement.className.toString().split(' ').join('.')}` : '';
            const details = `<${targetElement.tagName.toLowerCase()}>${elementId}${elementClasses}`.substring(0, 150);
            const time = getFormattedTime();

            const clickEmbed = {
                title: "CLICK",
                color: 3447003,
                fields: [
                    { name: "IP", value: visitorIP, inline: true },
                    { name: "Time UTC", value: time.utc, inline: true },
                    { name: "Time Moscow", value: time.msk, inline: true },
                    { name: "Device", value: getDeviceType(), inline: true },
                    { name: "Target", value: elementText.substring(0, 100) || "—", inline: true },
                    { name: "Href", value: hrefAttr.substring(0, 200) || "—", inline: false },
                    { name: "Selector", value: details || "—", inline: false }
                ]
            };

            sendDiscordWebhook(clickEmbed);
        } catch (e) {}
    }, true);
</script>
</body>
</html>
