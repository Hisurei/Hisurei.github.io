    <style>
        body {

            color: #e3e2e5;

        /* Ambient Mesh Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 10% 40%, rgba(8, 92, 150, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 90% 80%, rgba(38, 40, 46, 0.9) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(95, 111, 129, 0.1) 0%, transparent 70%);
            background-color: #050608;
            z-index: -2;
        }

        /* 5-Line Vertical Grid */
        .vertical-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            padding: 0 10vw;
        }
        
        .vertical-line {
            width: 1px;
            height: 100%;
            background: rgba(255, 255, 255, 0.06);
        }

        /* Clear Glassmorphism Cards */
        .clear-glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 4px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .clear-glass:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Entrance / Scroll Reveal Animations */
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fade-in-up.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

<script>
    // Subtle parallax effect for the ambient background
    document.addEventListener('mousemove', (e) => {
        const bg = document.querySelector('.ambient-bg');
        if (!bg) return;
        const xAxis = (window.innerWidth / 2 - e.clientX) / 100;
        const yAxis = (window.innerHeight / 2 - e.clientY) / 100;
        bg.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
    });

    // Copy to clipboard with instant visual feedback
    function copyToClipboard(containerElement, textToCopy) {
        if (!navigator.clipboard) {
            const tempInput = document.createElement("input");
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            triggerFeedback(containerElement);
            return;
        }

        navigator.clipboard.writeText(textToCopy).then(() => {
            triggerFeedback(containerElement);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
        });
    }

    function triggerFeedback(containerElement) {
        const textSpan = containerElement.querySelector('.copy-target');
        if (!textSpan || containerElement.dataset.isCopying === 'true') return;

        containerElement.dataset.isCopying = 'true';
        const originalText = textSpan.textContent;
        
        textSpan.textContent = 'COPIED //';
        textSpan.classList.add('text-primary');

        setTimeout(() => {
            textSpan.textContent = originalText;
            textSpan.classList.remove('text-primary');
            delete containerElement.dataset.isCopying;
        }, 1800);
    }

    // Scroll Reveal Intersection Observer
    document.addEventListener('DOMContentLoaded', () => {
        const observerOptions = {
            root: null,
            rootMargin: '0px 0px -40px 0px',
            threshold: 0.1
        };

        const fadeObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in-up').forEach(el => {
            fadeObserver.observe(el);
        });
    });
</script>
