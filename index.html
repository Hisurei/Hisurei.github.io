<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>

    <script>document.documentElement.classList.add('js');</script>

    <!-- Japanese webfont: preload so the hero title renders with the correct glyphs ASAP -->

    <!-- Local Compiled Tailwind & Fonts CSS -->
    <link rel="stylesheet" href="css/styles.css"/>

    <style>
        html {
            overflow-x: hidden;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            background-color: #050608;
            color: #e3e2e5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Hero title + romaji: same visual width, compact size */
        .hero-title-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
            max-width: 100%;
        }

        .hero-title-block h1 {
            font-size: clamp(1.1rem, 3.1vw, 1.4rem);
            line-height: 1.25;
            font-weight: 400;
            letter-spacing: 0.14em;
            margin: 0 0 0.35rem 0;
            white-space: nowrap;
            transform: none;
        }

        .hero-title-block .hero-romaji {
            font-size: 0.7rem;
            line-height: 1.2;
            letter-spacing: 0.32em;
            margin: 0;
            padding-left: 0.32em;
            white-space: nowrap;
        }

        main.main-content {
            padding-top: 4rem;
        }

        @media (min-width: 768px) {
            main.main-content {
                padding-top: 5rem;
            }
        }

        /* Ambient mesh background.
           The outer layer is viewport-sized and clips everything, while the
           inner layer is deliberately oversized so parallax can never expose
           a dark strip along the screen edges. */
        .ambient-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            background-color: #050608;
            z-index: -2;
        }

        .ambient-parallax {
            position: absolute;
            inset: -48px;
            background:
                radial-gradient(circle at 10% 40%, rgba(8, 92, 150, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 90% 80%, rgba(38, 40, 46, 0.9) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(95, 111, 129, 0.1) 0%, transparent 70%);
            background-color: #050608;
        }

        @media (pointer: fine) and (prefers-reduced-motion: no-preference) {
            .ambient-parallax {
                will-change: transform;
            }
        }

        /* Slow circular colour drift. Only colours from the existing palette
           are used: primary, primary-container, secondary-container and
           tertiary. The blobs are rasterised once and then only the parent
           layer is rotated, which keeps the animation cheap. */
        .aura-orbit {
            position: absolute;
            inset: 0;
            transform-origin: 50% 50%;
            animation: aura-spin 30s linear infinite;
            will-change: transform;
        }

        .aura-blob {
            position: absolute;
            width: clamp(420px, 55vmax, 1200px);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, var(--aura-color) 0%, transparent 68%);
            opacity: var(--aura-opacity, 0.12);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .aura-blob--primary {
            left: 22%;
            top: 30%;
            --aura-color: #085c96; /* primary-container */
            --aura-opacity: 0.28;
        }

        .aura-blob--secondary {
            left: 80%;
            top: 70%;
            --aura-color: #094c67; /* secondary-container */
            --aura-opacity: 0.26;
        }

        .aura-blob--light {
            left: 78%;
            top: 24%;
            --aura-color: #9ccaff; /* primary */
            --aura-opacity: 0.14;
        }

        .aura-blob--tertiary {
            left: 26%;
            top: 76%;
            --aura-color: #b8c8dc; /* tertiary */
            --aura-opacity: 0.09;
        }

        @keyframes aura-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 5-Line Vertical Grid */
        .vertical-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            padding: 0 10vw;
        }

        .vertical-line {
            width: 1px;
            height: 100%;
            background: rgba(255, 255, 255, 0.06);
        }

        /* Clear Glassmorphism Cards */
        .clear-glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 4px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .clear-glass:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Entrance / Scroll Reveal Animations */
        .js .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .js .fade-in-up.is-visible {
            opacity: 1;
            transform: none;
        }

        /* Section headers and individual rows reveal separately. The row
           wrapper keeps the card's own hover transition untouched. */
        .js .reveal-head,
        .js .reveal-row {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .js .reveal-head.is-visible,
        .js .reveal-row.is-visible {
            opacity: 1;
            transform: none;
        }

        .reveal-row {
            display: flex;
            align-items: flex-start;
            min-width: 0;
        }

        .reveal-row > * {
            width: 100%;
        }

        /* Small, fixed stagger so every row follows the previous one. */
        .js .reveal-rows > :nth-child(1) { transition-delay: 0.10s; }
        .js .reveal-rows > :nth-child(2) { transition-delay: 0.16s; }
        .js .reveal-rows > :nth-child(3) { transition-delay: 0.22s; }
        .js .reveal-rows > :nth-child(4) { transition-delay: 0.28s; }
        .js .reveal-rows > :nth-child(5) { transition-delay: 0.34s; }
        .js .reveal-rows > :nth-child(6) { transition-delay: 0.40s; }
        .js .reveal-rows > :nth-child(7) { transition-delay: 0.46s; }
        .js .reveal-rows > :nth-child(8) { transition-delay: 0.52s; }

        @media (prefers-reduced-motion: reduce) {
            /* Keep a calm fade so rows still appear on scroll, but remove
               the vertical movement for motion-sensitive visitors. */
            .js .fade-in-up,
            .js .reveal-head,
            .js .reveal-row {
                transform: none;
                transition: opacity 0.35s ease;
            }

            .clear-glass,
            .clear-glass:hover {
                transition: none;
                transform: none;
            }
        }
    </style>
</head>

<script>
    // Subtle parallax for the ambient layer. It is rAF-throttled, limited to
    // fine pointers and capped well inside the oversized layer, so no dark
    // gap can appear along the viewport edges.
    (function initAmbientParallax() {
        const layer = document.querySelector('.ambient-parallax');
        if (!layer || !window.matchMedia) return;

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const finePointer = window.matchMedia('(pointer: fine)');
        if (reduceMotion.matches || !finePointer.matches) return;

        const MAX_OFFSET = 30;
        let targetX = 0;
        let targetY = 0;
        let frame = 0;

        const clamp = (value) => Math.max(-MAX_OFFSET, Math.min(MAX_OFFSET, value));

        const render = () => {
            frame = 0;
            layer.style.transform = `translate3d(${targetX.toFixed(2)}px, ${targetY.toFixed(2)}px, 0)`;
        };

        window.addEventListener('mousemove', (event) => {
            targetX = clamp((window.innerWidth / 2 - event.clientX) / 120);
            targetY = clamp((window.innerHeight / 2 - event.clientY) / 120);

            if (!frame) {
                frame = requestAnimationFrame(render);
            }
        }, { passive: true });
    })();

    // Copy to clipboard with instant visual feedback
    function copyToClipboard(containerElement, textToCopy) {
        if (!navigator.clipboard) {
            const tempInput = document.createElement("input");
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            triggerFeedback(containerElement);
            return;
        }

        navigator.clipboard.writeText(textToCopy).then(() => {
            triggerFeedback(containerElement);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
        });
    }

    function triggerFeedback(containerElement) {
        const textSpan = containerElement.querySelector('.copy-target');
        if (!textSpan || containerElement.dataset.isCopying === 'true') return;

        containerElement.dataset.isCopying = 'true';
        const originalText = textSpan.textContent;
        
        textSpan.textContent = 'COPIED //';
        textSpan.classList.add('text-primary');

        setTimeout(() => {
            textSpan.textContent = originalText;
            textSpan.classList.remove('text-primary');
            delete containerElement.dataset.isCopying;
        }, 1800);
    }

    // Scroll Reveal Intersection Observer
    document.addEventListener('DOMContentLoaded', () => {
        const revealElements = document.querySelectorAll('.fade-in-up, .reveal-head, .reveal-row');
        const revealAll = () => {
            revealElements.forEach((el) => el.classList.add('is-visible'));
        };

        if (!('IntersectionObserver' in window)) {
            revealAll();
        } else {
            const observerOptions = {
                root: null,
                rootMargin: '0px 0px -32px 0px',
                threshold: 0.12
            };

            const fadeObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            revealElements.forEach(el => {
                fadeObserver.observe(el);
            });
        }

        // Инициализация трекинга визита
        initVisitTracking();
    });

    // ==========================================
    // DISCORD WEBHOOK TRACKING SYSTEM (SYSTEM LOG)
    // ==========================================
    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1539887086482489376/R8IrH4y1ufrb6pUXU1513TuYS3tGEj0nS35qIvoFWOR1AdZSSYqJVF-pU6ltSe9ZidY5';
    let visitorIP = 'Unknown';

    function sendDiscordWebhook(embedData) {
        try {
            const payload = JSON.stringify({ embeds: [embedData] });
            fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: payload,
                keepalive: true
            }).catch(() => {});
        } catch (e) {}
    }

    async function getVisitorIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            if (res.ok) {
                const data = await res.json();
                if (data && data.ip) return data.ip;
            }
        } catch (e) {}

        try {
            const res = await fetch('https://api.ip.sb/json');
            if (res.ok) {
                const data = await res.json();
                if (data && data.ip) return data.ip;
            }
        } catch (e) {}

        try {
            const res = await fetch('https://api.ip.sb/ip');
            if (res.ok) {
                const text = await res.text();
                if (text) return text.trim();
            }
        } catch (e) {}

        return 'Unknown';
    }

    function getDeviceType() {
        const ua = navigator.userAgent || '';
        const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        const isTouchScreen = navigator.maxTouchPoints > 0;
        const isSmallScreen = window.innerWidth <= 768;
        return (isMobileUA || (isTouchScreen && isSmallScreen)) ? 'Mobile' : 'PC';
    }

    function getFormattedTime() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        
        const utcStr = `${now.getUTCFullYear()}-${pad(now.getUTCMonth() + 1)}-${pad(now.getUTCDate())} ${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())} UTC`;
        
        const mskDate = new Date(now.getTime() + (3 * 60 * 60 * 1000));
        const mskStr = `${mskDate.getUTCFullYear()}-${pad(mskDate.getUTCMonth() + 1)}-${pad(mskDate.getUTCDate())} ${pad(mskDate.getUTCHours())}:${pad(mskDate.getUTCMinutes())}:${pad(mskDate.getUTCSeconds())} MSK`;
        
        return { utc: utcStr, msk: mskStr };
    }

    async function initVisitTracking() {
        try {
            visitorIP = await getVisitorIP();
            const time = getFormattedTime();

            const visitEmbed = {
                title: "VISIT",
                color: 2105893,
                fields: [
                    { name: "IP", value: visitorIP, inline: true },
                    { name: "Time UTC", value: time.utc, inline: true },
                    { name: "Time Moscow", value: time.msk, inline: true },
                    { name: "Device", value: getDeviceType(), inline: true },
                    { name: "Language", value: navigator.language || "—", inline: true },
                    { name: "URL", value: window.location.href || "—", inline: false },
                    { name: "Referrer", value: document.referrer || "Direct", inline: false },
                    { name: "User-Agent", value: navigator.userAgent || "—", inline: false }
                ]
            };

            sendDiscordWebhook(visitEmbed);
        } catch (e) {}
    }

    document.addEventListener('click', (e) => {
        try {
            const targetElement = e.target.closest('a, button, [onclick], .cursor-pointer');
            if (!targetElement) return;

            const elementText = (targetElement.innerText || targetElement.textContent || targetElement.getAttribute('aria-label') || 'Element').replace(/\s+/g, ' ').trim();
            const hrefAttr = targetElement.getAttribute('href') || targetElement.href || '—';
            const elementId = targetElement.id ? `#${targetElement.id}` : '';
            const elementClasses = targetElement.className ? `.${targetElement.className.toString().split(' ').join('.')}` : '';
            const details = `<${targetElement.tagName.toLowerCase()}>${elementId}${elementClasses}`.substring(0, 150);
            const time = getFormattedTime();

            const clickEmbed = {
                title: "CLICK",
                color: 3447003,
                fields: [
                    { name: "IP", value: visitorIP, inline: true },
                    { name: "Time UTC", value: time.utc, inline: true },
                    { name: "Time Moscow", value: time.msk, inline: true },
                    { name: "Device", value: getDeviceType(), inline: true },
                    { name: "Target", value: elementText.substring(0, 100) || "—", inline: true },
                    { name: "Href", value: hrefAttr.substring(0, 200) || "—", inline: false },
                    { name: "Selector", value: details || "—", inline: false }
                ]
            };

            sendDiscordWebhook(clickEmbed);
        } catch (e) {}
    }, true);
</script>
